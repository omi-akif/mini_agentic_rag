[project]
name = "mini_agentic_rag"
version = "0.1.0"
description = "mini_agentic_rag using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "langchain-openai",
    "langchain-community",
    "python-dotenv"
]

[project.scripts]
mini_agentic_rag = "mini_agentic_rag.main:run"
run_crew = "mini_agentic_rag.main:run"
train = "mini_agentic_rag.main:train"
replay = "mini_agentic_rag.main:replay"
test = "mini_agentic_rag.main:test"
run_with_trigger = "mini_agentic_rag.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
