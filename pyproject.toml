[project]
name = "mini_agentic_rag"
version = "0.1.0"
description = "Simple modular agentic RAG system"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain-openai",
    "langchain-community",
    "langchain-core",
    "langchain-text-splitters",
    "python-dotenv",
    "pypdf",
    "qdrant-client",
    "langchain-qdrant",
    "litellm",
    "pyyaml"
]

[project.scripts]
rag = "mini_agentic_rag.main:main"
ingest = "mini_agentic_rag.ingestion:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
