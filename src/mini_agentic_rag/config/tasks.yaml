knowledge_extraction_task:
  description: >
    Extract information from the knowledge base for the following question: {question}
    Ensure you use the search tool to find the most relevant sections of the policy.
  expected_output: >
    A draft answer based on the retrieved context, citing the relevant sections.

critique_task:
  description: >
    Review the initial answer for the question: {question}
    Use the retrieved context: {context}
    Ensure the answer is accurate, complete, and follows the policy booklet strictly.
  expected_output: >
    A final, refined, and accurate answer to the user's question.
